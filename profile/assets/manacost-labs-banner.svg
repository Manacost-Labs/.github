<linearGradient id="card" x2="1" y2="1"><stop stop-color="#243d42"/><stop offset=".5" stop-color="#101d23"/><stop offset="1" stop-color="#080e13"/></linearGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#baffef"/><stop offset=".45" stop-color="#4bb9b5"/><stop offset="1" stop-color="#21464e"/></linearGradient>
<clipPath id="clip"><rect width="1280" height="320" rx="22"/></clipPath>
</defs>
