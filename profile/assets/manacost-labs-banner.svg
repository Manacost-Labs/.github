<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
<title id="title">Manacost Labs — инженерная команда Манакоста</title>
<desc id="desc">Сайты, аналитика и инструменты для русскоязычного сообщества Hearthstone. Авторская композиция из игровых карт и гранёного кристалла в бирюзовых, белых и чёрных тонах.</desc>
