<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Manacost Labs</title>
  <desc id="desc">Знания, данные и сообщество для игроков Hearthstone</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071E31"/>
      <stop offset="0.55" stop-color="#0D3E5A"/>
      <stop offset="1" stop-color="#126681"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77E2FF"/>
      <stop offset="1" stop-color="#2A77BF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD979"/>
      <stop offset="0.5" stop-color="#E79532"/>
      <stop offset="1" stop-color="#D77017"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#55CDEB" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#55CDEB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#A9E9F5" stroke-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000A12" flood-opacity="0.48"/>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="1090" cy="120" rx="330" ry="270" fill="url(#glow)"/>
  <ellipse cx="90" cy="370" rx="310" ry="230" fill="url(#glow)" opacity="0.65"/>

  <g opacity="0.42" fill="none" stroke="#8FE8FA">
    <circle cx="1108" cy="176" r="126" stroke-opacity="0.2"/>
    <circle cx="1108" cy="176" r="151" stroke-opacity="0.12"/>
    <path d="M870 64C960 8 1126 4 1228 80" stroke-opacity="0.18"/>
    <path d="M895 303C1001 347 1161 337 1247 258" stroke-opacity="0.14"/>
  </g>

  <g transform="translate(72 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="116" height="154" rx="19" fill="#0A2940" stroke="url(#blue)" stroke-width="4"/>
    <rect x="13" y="13" width="90" height="128" rx="13" fill="#0E3A55" stroke="#90E5F4" stroke-opacity="0.24"/>
    <path d="M58 37C37 55 35 81 50 96C61 107 80 105 88 93C97 79 88 63 74 65C64 66 60 77 66 83C70 88 79 86 80 80" fill="none" stroke="#F3B94F" stroke-width="9" stroke-linecap="round" filter="url(#soft-glow)"/>
    <circle cx="58" cy="117" r="5" fill="#77E2FF"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="230" y="142" fill="#FFFFFF" font-size="68" font-weight="800" letter-spacing="1">MANACOST</text>
    <text x="230" y="208" fill="#F3B94F" font-size="62" font-weight="800" letter-spacing="8">LABS</text>
    <rect x="230" y="239" width="68" height="4" rx="2" fill="#67D9F1"/>
    <text x="315" y="249" fill="#C6EDF5" font-size="19" font-weight="600" letter-spacing="3">ЗНАНИЯ • ДАННЫЕ • СООБЩЕСТВО</text>
  </g>

  <g transform="translate(935 48) rotate(-8 120 130)" filter="url(#shadow)">
    <rect x="75" y="30" width="154" height="218" rx="22" fill="#0A2336" stroke="#61D6EF" stroke-width="3"/>
    <rect x="88" y="43" width="128" height="192" rx="15" fill="#103F5B" stroke="#A7ECF8" stroke-opacity="0.28"/>
    <path d="M152 82L172 118L213 125L184 154L190 195L152 176L115 195L121 154L91 125L132 118Z" fill="url(#blue)" opacity="0.9"/>
    <circle cx="152" cy="139" r="24" fill="#0C314A" stroke="#C9F4FA" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M152 123L163 140L152 157L141 140Z" fill="url(#gold)"/>
  </g>

  <g transform="translate(1070 90) rotate(9 86 108)" filter="url(#shadow)">
    <rect x="30" y="20" width="137" height="194" rx="20" fill="#17243A" stroke="#EAA03D" stroke-width="3"/>
    <rect x="42" y="32" width="113" height="170" rx="14" fill="#24364D" stroke="#FFD979" stroke-opacity="0.35"/>
    <circle cx="98" cy="115" r="40" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <path d="M98 86C80 100 79 121 91 132C101 141 116 137 120 126C124 116 117 107 108 109C101 111 100 118 104 122" fill="none" stroke="#FFE6A1" stroke-width="7" stroke-linecap="round"/>
  </g>

  <rect x="1.5" y="1.5" width="1277" height="357" rx="26.5" fill="none" stroke="#A7ECF8" stroke-opacity="0.18" stroke-width="3"/>
</svg>
